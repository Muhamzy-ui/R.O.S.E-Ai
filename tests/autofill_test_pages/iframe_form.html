<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>R.O.S.E Autofill Test 3 — Nested Iframe Form</title>
  <style>
    body { font-family: Segoe UI, sans-serif; background: #0b101b; color: #e2e8f0; max-width: 760px; margin: 28px auto; padding: 0 18px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 14px; padding: 22px; margin-bottom: 16px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #94a3b8; margin-bottom: 12px; }
    input { padding: 9px 11px; border-radius: 8px; border: 1px solid #334155; background: #090d16; color: #f8fafc; }
    iframe { width: 100%; height: 460px; border: 1px solid #334155; border-radius: 12px; background: #0f172a; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Top Frame + Embedded Iframe (Test Page 3)</h2>
    <p>Tests `all_frames: true` content script + multi-frame count aggregation in background service worker.</p>
    <label>Full Name (Top Frame) <input id="top_name" name="full_name" type="text" /></label>
    <label>Email (Top Frame) <input id="top_email" name="email" type="email" /></label>
  </div>
  <iframe id="grnhse_iframe" src="iframe_child.html" title="Embedded ATS Application"></iframe>
</body>
</html>
